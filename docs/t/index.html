<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segue</title>
<meta name="description" content="A song shared from Segue">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #0e0d10;
    --card: #1a181d;
    --text: #f4f1f6;
    --dim: #a9a3ae;
    --accent: #ff9a76;
    --ink: #1b1214;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .glow {
    position: fixed; inset: -20%;
    background: radial-gradient(40% 40% at 30% 30%, rgba(255,154,118,.25), transparent 70%),
                radial-gradient(40% 40% at 75% 70%, rgba(123,92,255,.22), transparent 70%);
    filter: blur(40px); z-index: -1;
  }
  .card {
    width: 100%; max-width: 380px;
    background: rgba(26,24,29,.82);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px;
    padding: 22px;
    text-align: center;
    backdrop-filter: blur(20px);
  }
  .cover {
    width: 100%; aspect-ratio: 1; border-radius: 20px;
    object-fit: cover; background: #26232a; display: block;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  h1 { font-size: 22px; margin: 18px 0 4px; line-height: 1.25; word-break: break-word; }
  .artist { color: var(--dim); margin: 0 0 20px; font-size: 16px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 16px; margin-top: 10px;
    border-radius: 16px; text-decoration: none; font-weight: 700; font-size: 16px;
  }
  .primary { background: var(--accent); color: var(--ink); }
  .secondary { background: rgba(255,255,255,.08); color: var(--text); }
  .foot { margin-top: 18px; font-size: 13px; color: var(--dim); }
  .foot a { color: var(--dim); }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; font-weight: 800; }
  .brand img { width: 24px; height: 24px; border-radius: 6px; }
  .error { color: var(--dim); }
</style>
</head>
<body>
<div class="glow"></div>
<main class="card" id="card">
  <div class="brand"><img src="icon.png" alt=""> Segue</div>
  <p class="error" id="error" hidden></p>
  <div id="song" hidden>
    <img class="cover" id="cover" alt="">
    <h1 id="title"></h1>
    <p class="artist" id="artist"></p>
    <a class="btn primary" id="open" href="#"></a>
    <a class="btn secondary" id="youtube" href="#" target="_blank" rel="noopener"></a>
    <a class="btn secondary" id="get" href="https://github.com/segue-app/segue/releases/latest" target="_blank" rel="noopener"></a>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script>
(function () {
  var ru = (navigator.language || '').toLowerCase().indexOf('ru') === 0;
  var T = ru ? {
    open: 'Открыть в Segue',
    youtube: 'Слушать на YouTube',
    get: 'Скачать Segue',
    foot: 'Segue — бесплатный плеер: YouTube, SoundCloud, Spotify и Яндекс Музыка в одном месте.',
    bad: 'Ссылка повреждена.'
  } : {
    open: 'Open in Segue',
    youtube: 'Listen on YouTube',
    get: 'Get Segue',
    foot: 'Segue is a free player: YouTube, SoundCloud, Spotify and Yandex Music in one place.',
    bad: 'This link is broken.'
  };
  document.documentElement.lang = ru ? 'ru' : 'en';
  document.getElementById('foot').textContent = T.foot;

  var data = location.hash.slice(1);
  var song = null;
  try {
    var b64 = data.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    song = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { song = null; }

  if (!song || !song.t) {
    var err = document.getElementById('error');
    err.textContent = T.bad;
    err.hidden = false;
    return;
  }

  // Only text is put on the page (never HTML from the link).
  document.title = song.t + ' — ' + (song.a || '') + ' · Segue';
  document.getElementById('title').textContent = song.t;
  document.getElementById('artist').textContent = song.a || '';
  var cover = document.getElementById('cover');
  var art = song.c || (song.y ? 'https://i.ytimg.com/vi/' + encodeURIComponent(song.y) + '/hqdefault.jpg' : '');
  if (/^https:\/\//.test(art)) cover.src = art; else cover.style.display = 'none';

  var open = document.getElementById('open');
  open.textContent = T.open;
  open.href = 'segue://track?d=' + encodeURIComponent(data);

  var yt = document.getElementById('youtube');
  yt.textContent = T.youtube;
  yt.href = song.y
    ? 'https://youtu.be/' + encodeURIComponent(song.y)
    : 'https://www.youtube.com/results?search_query=' + encodeURIComponent((song.a || '') + ' ' + song.t);

  document.getElementById('get').textContent = T.get;
  document.getElementById('song').hidden = false;
})();
</script>
</body>
</html>
