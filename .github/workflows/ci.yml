name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Infos (such as deprecations in a newer Flutter) are shown, not fatal.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --exclude-tags live
