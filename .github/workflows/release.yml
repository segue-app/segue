# Builds every desktop and Android target when a version tag is pushed
# (git tag v0.1.0 && git push --tags) and attaches them to a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Optional: Settings → Secrets → Actions → DISCORD_CLIENT_ID.
  DEFINES: --dart-define=DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The permanent release key (repository secrets), so new versions
      # install over old ones and the in-app update works.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/segue.jks"
            echo "SEGUE_KEYSTORE=$RUNNER_TEMP/segue.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: debug-signed APKs"
          fi
      - run: flutter build apk --release --split-per-abi $DEFINES
        env:
          SEGUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEGUE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEGUE_KEY_ALIAS: segue
      - run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk segue-android-arm64.apk
          mv app-armeabi-v7a-release.apk segue-android-armv7.apk
          mv app-x86_64-release.apk segue-android-x86_64.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: build/app/outputs/flutter-apk/segue-android-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release ${{ env.DEFINES }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath segue-windows-x64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: segue-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    # GitHub's runners sometimes lose DNS for the Ubuntu mirrors; don't let
    # that hold the whole release for an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update
          sudo apt-get $APT install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build linux --release ${{ env.DEFINES }}
      - run: tar -czf segue-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: segue-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/Segue.app segue-macos.zip
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: segue-macos.zip

  release:
    needs: [android, windows, linux, macos]
    # Publish whatever was built, even if one platform failed.
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
