# Builds every desktop and Android target when a version tag is pushed
# (git tag v0.1.0 && git push --tags) and attaches them to a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Optional: Settings → Secrets → Actions → DISCORD_CLIENT_ID.
  DEFINES: --dart-define=DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The permanent release key (repository secrets), so new versions
      # install over old ones and the in-app update works.
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/segue.jks"
            echo "SEGUE_KEYSTORE=$RUNNER_TEMP/segue.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: debug-signed APKs"
          fi
      - run: flutter build apk --release --split-per-abi $DEFINES
        env:
          SEGUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEGUE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SEGUE_KEY_ALIAS: segue
      - run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk segue-android-arm64.apk
          mv app-armeabi-v7a-release.apk segue-android-armv7.apk
          mv app-x86_64-release.apk segue-android-x86_64.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: build/app/outputs/flutter-apk/segue-android-*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release ${{ env.DEFINES }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath segue-windows-x64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: segue-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    # GitHub's runners sometimes lose DNS for the Ubuntu mirrors; don't let
    # that hold the whole release for an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update
          sudo apt-get $APT install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build linux --release ${{ env.DEFINES }}
      - run: tar -czf segue-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: segue-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      # The same certificate every release: macOS keeps Segue's microphone
      # and system audio permissions across updates (see macos/sign.sh).
      - name: Sign with Segue's certificate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::warning::MACOS_CERT_P12 is not set: ad-hoc signed, permissions reset on update"
            exit 0
          fi
          KC="$RUNNER_TEMP/segue.keychain-db"
          KP=$(openssl rand -hex 16)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/segue.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/segue.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" > /dev/null
          # codesign looks only in the keychains on the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          rm "$RUNNER_TEMP/segue.p12"
          macos/sign.sh build/macos/Build/Products/Release/Segue.app "$KC"
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/Segue.app segue-macos.zip
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: segue-macos.zip

  release:
    needs: [android, windows, linux, macos]
    # Publish whatever was built, even if one platform failed. Only for a
    # version tag: a manual run just builds (to check a platform).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Android: «Приложение не установлено»?** Segue до версии 0.3.4 был подписан другим ключом, и Android не даёт поставить новую версию поверх. Сохрани библиотеку (Настройки → Резервная копия), удали старую Segue и поставь эту. Дальше обновления ставятся сами.
            **Android: "App not installed"?** Segue before 0.3.4 was signed with another key, so Android won't install over it. Save your library (Settings → Backup), remove the old Segue and install this one. Updates install by themselves after that.

            **Mac: «Что играет?» не слышит звук после обновления?** С версии 0.3.37 Segue подписан постоянным сертификатом, и macOS один раз спросит доступ заново. Если не спросила: Системные настройки → Конфиденциальность и безопасность → Микрофон и «Запись экрана и системного звука», убери Segue оттуда и разреши снова. Дальше разрешения переживают обновления.
            **Mac: "What's playing?" hears nothing after updating?** Since 0.3.37 Segue is signed with a lasting certificate, and macOS asks once more. If it didn't: System Settings → Privacy & Security → Microphone and "Screen & System Audio Recording", remove Segue there and allow it again. Permissions survive updates after that.

            **Треки не играют или импорт не работает?** Настройки → Проверка связи покажет, что недоступно из твоей сети (YouTube заблокирован в России, Яндекс Музыка работает только из России и Беларуси).
